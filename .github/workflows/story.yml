name: story-video
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install TTS
        run: |
          - name: Install TTS
          run: |
          python3 -m pip install --quiet torch torchaudio soundfile omegaconf

      - name: Install ffmpeg (static build)
        timeout-minutes: 6
        run: |
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/ff.tar.xz
          mkdir -p /tmp/ff && tar xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          sudo cp "$(find /tmp/ff -name ffmpeg -type f | head -1)" /usr/local/bin/ffmpeg
          sudo cp "$(find /tmp/ff -name ffprobe -type f | head -1)" /usr/local/bin/ffprobe
          ffmpeg -version | head -1

      - name: Build Video
        run: node story_maker.js

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: story-video
          path: episode_1_final.mp4
